<section class="calendar-card card" id="calendar-app" data-mode="{{ calendar_mode }}" data-api="{{ api_url }}" data-date="{{ selected_date|date:'Y-m-d' }}">
  <div class="calendar-toolbar"><a class="calendar-nav" href="{{ previous_month }}" aria-label="이전 달">←</a><h2>{{ month_label }}</h2><a class="calendar-nav" href="{{ next_month }}" aria-label="다음 달">→</a></div>
  <div class="calendar-weekdays" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
  <div class="month-calendar" aria-label="{{ month_label }} {{ calendar_title }} 달력">{% for week in weeks %}{% for day in week %}{% if day %}<a class="calendar-day{% if day == selected_date.day %} selected{% endif %}" data-calendar-date="{{ month }}-{{ day|stringformat:'02d' }}" href="?month={{ month }}&date={{ month }}-{{ day|stringformat:'02d' }}{% if vehicle %}&vehicle={{ vehicle.pk }}{% endif %}{% if department_filter %}&department={{ department_filter }}{% endif %}{% if pending_only %}&pending=1{% endif %}" aria-label="{{ month }}-{{ day|stringformat:'02d' }}"><span class="calendar-number">{{ day }}</span><span class="calendar-events"></span></a>{% else %}<div class="calendar-blank" aria-hidden="true"></div>{% endif %}{% endfor %}{% endfor %}</div>
  {% if calendar_mode != 'vehicles' %}<div class="calendar-legend"><span class="state pending">승인 대기</span><span class="state approved">승인 완료</span><span class="state rejected">반려</span><span class="state cancelled">취소</span></div>{% endif %}
  <p id="calendar-sync" class="calendar-sync" role="status">최신 일정 확인 중</p>
</section>
{{ calendar_data|json_script:'calendar-data' }}
<form hidden id="calendar-token">{% csrf_token %}</form>
