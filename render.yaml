# Independent task-2 free interview demo. No paid service or persistent disk.
services:
  - type: web
    name: goodmona-staff-intranet-demo
    runtime: python
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SQLITE_PATH
        value: /tmp/goodmona-intranet/intranet.sqlite3
      - key: INTRANET_STORAGE_MODE
        value: ephemeral
      - key: SEED_DEMO
        value: 'true'
      # Optional OPENAI_API_KEY: add as a secret in Render Environment after creation.
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
